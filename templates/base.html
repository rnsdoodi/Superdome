<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeddah Superdome Portal</title>
    <!-- تم تعديل المسار ليتناسب مع مجلد static مباشرة -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00e676; color: #0a1f0a; padding: 15px 40px 15px 20px; border-radius: 8px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: 600; font-family: 'Segoe UI', sans-serif;">
            {{ messages[0] }}
            <span onclick="this.parentElement.style.display='none'" style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; font-weight: bold;">&times;</span>
        </div>
    {% endif %}
{% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
